<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>ReadUp! Comprehension</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦉</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --brand: #FF6B35;
    --brand-deep: #E55D2B;
    --brand-light: #FFB088;
    --brand-soft: #FFF3E8;
    --bg: #FFFBF2;
    --card: #FFFFFF;
    --section: #FFF8EE;
    --ink: #2C3E50;
    --body: #4A5568;
    --muted: #64748B;
    --border: #F0E6D8;
    --gold: #FFD93D;
    --green: #2E9E4F;
    --green-soft: #E8F7EC;
    --coral: #E5484D;
    --ocean: #2F7FE0;
    --ocean-soft: #EAF3FF;
    --shadow: 0 4px 24px rgba(255,107,53,0.08);
    --r: 18px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--body);
    font-family: 'Nunito', system-ui, sans-serif;
    font-size: 17px;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }
  h1, h2, h3 { font-family: 'Fredoka', 'Nunito', sans-serif; color: var(--ink); margin: 0 0 8px; line-height: 1.2; }
  h1 { font-size: 26px; font-weight: 600; }
  h2 { font-size: 21px; font-weight: 600; }
  h3 { font-size: 17px; font-weight: 600; }
  p { margin: 0 0 10px; }
  button, input, select, textarea { font: inherit; }

  .wrap { max-width: 720px; margin: 0 auto; padding: 12px 16px 120px; }
  header.top {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 16px; background: var(--card); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
  }
  header.top .brand { white-space: nowrap; font-family: 'Fredoka', sans-serif; font-weight: 600; color: var(--ink); font-size: 19px; display: flex; gap: 8px; align-items: center; }
  header.top .brand small { color: var(--brand); font-weight: 600; }
  header.top a { color: var(--muted); font-size: 14px; text-decoration: none; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); padding: 18px; margin: 14px 0; box-shadow: var(--shadow); }
  .muted { color: var(--muted); font-size: 15px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .spacer { flex: 1; }

  .btn {
    border: 0; border-radius: 14px; padding: 13px 18px; cursor: pointer;
    background: var(--brand); color: #fff; font-weight: 800; font-size: 16px;
    min-height: 48px;
  }
  .btn:active { transform: translateY(1px); }
  .btn[disabled] { opacity: .5; cursor: default; }
  .btn.secondary { background: var(--brand-soft); color: var(--brand-deep); }
  .btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .btn.small { padding: 8px 12px; min-height: 38px; font-size: 14px; border-radius: 10px; }
  .btn.block { width: 100%; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 2px solid var(--border); background: var(--card); color: var(--ink);
    border-radius: 999px; padding: 8px 14px; cursor: pointer; font-weight: 700; font-size: 15px;
  }
  .chip.on { border-color: var(--brand); background: var(--brand-soft); color: var(--brand-deep); }

  label.field { display: block; font-weight: 700; color: var(--ink); font-size: 15px; margin: 10px 0 4px; }
  input[type=text], input[type=number], select, textarea {
    width: 100%; padding: 11px 12px; border: 2px solid var(--border); border-radius: 12px; background: #fff; color: var(--ink);
  }
  textarea { min-height: 64px; resize: vertical; }

  .kid {
    display: flex; align-items: center; gap: 10px; padding: 12px; border: 2px solid var(--border);
    border-radius: 14px; margin: 8px 0; cursor: pointer; background: #fff;
  }
  .kid.on { border-color: var(--brand); background: var(--brand-soft); }
  .kid .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--gold); display: grid; place-items: center; font-family: 'Fredoka'; font-weight: 600; color: var(--ink); font-size: 18px; flex: none; }
  .kid .meta { font-size: 13px; color: var(--muted); }
  .kid .name { font-weight: 800; color: var(--ink); }
  .check { width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--border); display: grid; place-items: center; flex: none; font-size: 15px; color: #fff; }
  .on .check { background: var(--brand); border-color: var(--brand); }

  .steps { display: flex; gap: 4px; margin: 12px 0 4px; }
  .steps div { flex: 1; height: 6px; border-radius: 4px; background: var(--border); }
  .steps div.done { background: var(--brand-light); }
  .steps div.now { background: var(--brand); }
  .steplabel { font-size: 13px; font-weight: 800; color: var(--brand-deep); text-transform: uppercase; letter-spacing: .04em; }

  .badge { display: inline-block; font-size: 13px; font-weight: 800; padding: 3px 10px; border-radius: 999px; background: var(--ocean-soft); color: var(--ocean); }
  .badge.warn { background: #FFF4D6; color: #8A6100; }

  .story { font-size: 19px; line-height: 1.75; color: var(--ink); }
  .story p { margin: 0 0 16px; }
  .story.big { font-size: 22px; }
  .stop {
    border-left: 5px solid var(--coral); background: #FFF1F0; border-radius: 12px;
    padding: 12px 14px; margin: 4px 0 18px; font-size: 16px; line-height: 1.5;
  }
  .stop b { color: var(--coral); }
  .stop .look { color: var(--muted); font-size: 14px; margin-top: 6px; display: none; }
  .stop.open .look { display: block; }
  .reader-tag { display: inline-block; font-size: 12px; font-weight: 800; padding: 2px 9px; border-radius: 999px; margin-bottom: 4px; }
  .rt0 { background: var(--brand-soft); color: var(--brand-deep); }
  .rt1 { background: var(--ocean-soft); color: var(--ocean); }

  .script { background: var(--section); border-radius: 12px; padding: 12px 14px; font-style: italic; color: var(--ink); }
  .signal { display: inline-block; background: #FFF4D6; color: #7A5600; font-weight: 800; border-radius: 8px; padding: 2px 8px; margin: 2px; font-size: 15px; }

  .q { padding: 10px 0; border-top: 1px solid var(--border); }
  .q:first-child { border-top: 0; }
  .q .a { color: var(--green); font-size: 15px; display: none; margin-top: 4px; }
  .q.open .a { display: block; }

  .org-grid { display: grid; gap: 10px; }
  .org-box { border: 2px dashed var(--brand-light); border-radius: 12px; padding: 10px; }
  .org-box h3 { font-size: 15px; margin-bottom: 6px; color: var(--brand-deep); }
  .org-3 { grid-template-columns: 1fr; }
  @media (min-width: 560px) { .org-3 { grid-template-columns: 1fr 1fr 1fr; } }

  .rubric label { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--border); cursor: pointer; }
  .rubric label:first-of-type { border-top: 0; }
  .rubric input { width: 24px; height: 24px; accent-color: var(--brand); flex: none; margin-top: 2px; }
  .score { font-family: 'Fredoka'; font-size: 34px; color: var(--brand); font-weight: 600; }

  .timer { font-family: 'Fredoka'; font-size: 30px; color: var(--ink); min-width: 80px; }

  .navbar {
    position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--border);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); z-index: 10;
  }
  .navbar .inner { max-width: 720px; margin: 0 auto; display: flex; gap: 10px; }
  .navbar .btn { flex: 1; }

  .loading { text-align: center; padding: 40px 10px; }
  .spin { width: 42px; height: 42px; border: 5px solid var(--brand-soft); border-top-color: var(--brand); border-radius: 50%; margin: 0 auto 14px; animation: sp 1s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .error { background: #FFF1F0; border: 1px solid #F5C2C0; color: #8E1F1C; border-radius: 12px; padding: 14px; }

  .hist { width: 100%; border-collapse: collapse; font-size: 14px; }
  .hist td, .hist th { padding: 7px 4px; border-top: 1px solid var(--border); text-align: left; }
  .hist th { color: var(--muted); font-weight: 700; border-top: 0; }

  .hidden { display: none !important; }
  #printArea { display: none; }

  @media print {
    body { background: #fff; font-size: 13pt; color: #000; }
    header.top, .navbar, #app { display: none !important; }
    #printArea { display: block; padding: 0; }
    #printArea h1 { font-size: 20pt; color: #000; }
    #printArea .story { font-size: 14pt; line-height: 1.7; color: #000; }
    #printArea .org-box { border: 1.5px solid #000; min-height: 90px; break-inside: avoid; }
    #printArea .org-box h3 { color: #000; }
    #printArea .pagebreak { break-before: page; }
    #printArea .line { border-bottom: 1px solid #888; height: 30px; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="brand">🦉 ReadUp! <small>Comprehension</small></div>
  <a href="./">← ReadUp</a>
</header>

<main id="app" class="wrap"></main>
<div id="navbar" class="navbar hidden"><div class="inner" id="navInner"></div></div>
<div id="printArea"></div>

<script>
/* ─────────────────────────────────────────────────────────────
   ReadUp! Comprehension Mode
   One 20–30 min session: Teach → Listen → Read → Organize → Retell.
   Stories come from the existing generateStory Cloud Function
   (custom instructions, no backend change). Profiles and scores
   are saved on this device only (localStorage).
   ───────────────────────────────────────────────────────────── */

const CF_STORY = "https://us-central1-readup-transforming-youth.cloudfunctions.net/generateStory";
const STORE_KEY = "readup_comprehension_v1";

/* ── Built-in story library (library.json, same folder) ──────────
   Ready-made, level-checked stories. Used first: instant, free,
   and works when the AI service is off. AI is optional variety. */
let LIB = null, libPromise = null;
function loadLibrary() {
  if (LIB) return Promise.resolve(LIB);
  if (!libPromise) {
    libPromise = fetch("library.json", { cache: "no-cache" })
      .then(r => { if (!r.ok) throw new Error("Story library " + r.status); return r.json(); })
      .then(d => {
        d.sessions.forEach(r => (r.est = textStats(r.paragraphs).lexile));
        d.placement.forEach(r => (r.est = textStats(r.paragraphs).lexile));
        LIB = d; return d;
      })
      .catch(e => { libPromise = null; throw e; });
  }
  return libPromise;
}
function libStory(raw, target) {
  const s = {
    id: raw.id, source: "library", title: raw.title, paragraphs: raw.paragraphs.slice(),
    stops: (raw.stops || []).map(x => Object.assign({}, x)),
    questions: (raw.questions || []).map(x => Object.assign({}, x))
  };
  s.stats = textStats(s.paragraphs);
  s.target = target;
  return s;
}
function usedBy(kidIds, key) {
  const u = new Set();
  kidIds.forEach(id => (((DB[key] || {})[id]) || []).forEach(x => u.add(x)));
  return u;
}
/* Closest-level story this reader hasn't had yet; random among the 3 closest. */
function pickFromPool(pool, level, used, exclude) {
  const cands = pool.filter(r => !exclude.includes(r.id));
  if (!cands.length) return null;
  const near = cands.filter(r => Math.abs(r.est - level) <= 100);
  const base = near.length ? near : cands;
  const fresh = base.filter(r => !used.has(r.id));
  const list = (fresh.length ? fresh : base).slice().sort((a, b) => Math.abs(a.est - level) - Math.abs(b.est - level));
  const top = list.slice(0, Math.min(3, list.length));
  return top[Math.floor(Math.random() * top.length)];
}
function markUsed(key, kidIds, ids) {
  DB[key] = DB[key] || {};
  kidIds.forEach(k => { DB[key][k] = (DB[key][k] || []).concat(ids.filter(Boolean)).slice(-300); });
}

/* ── Text structures (one per week, six-week rotation) ───────── */
const STRUCTURES = [
  {
    id: "story", name: "Story Elements", emoji: "📖", genre: "fiction story",
    what: "Every story has characters, a setting, a problem, events that happen because of the problem, and a solution.",
    kidQ: "Who is it about, where are they, what goes wrong, and how does it get fixed?",
    signals: ["one day", "but", "then", "so", "finally", "in the end"],
    aiDesc: "a clear story arc: introduce the main character and setting, present one clear problem, show 2-3 events where the character tries to deal with it, then a solution",
    think: "I just read that Maya's kite got stuck in the tree. I think that is the PROBLEM, because now the story is about how she will get it down. I'm going to watch for what she tries.",
    organizer: { type: "list", boxes: ["Characters", "Setting", "Problem", "Event 1", "Event 2", "Event 3", "Solution"] }
  },
  {
    id: "sequence", name: "Sequence", emoji: "🔢", genre: "fiction story",
    what: "Sequence means things happen in a certain order. The author uses time words to show what comes first, next, and last.",
    kidQ: "What happened first, next, then, and last? How do you know?",
    signals: ["first", "next", "then", "after that", "later", "finally"],
    aiDesc: "events told in a clear time order, with each step depending on the one before it",
    think: "The author wrote 'after that.' That tells me this part happened later. If I mixed these steps up, the story would not make sense.",
    organizer: { type: "list", boxes: ["First", "Next", "Then", "Last"] }
  },
  {
    id: "cause", name: "Cause & Effect", emoji: "⚡", genre: "nonfiction informational passage",
    what: "A cause is WHY something happens. An effect is WHAT happens because of it.",
    kidQ: "What made this happen? What happened because of it?",
    signals: ["because", "so", "since", "as a result", "that is why", "this caused"],
    aiDesc: "a cause-and-effect explanation where each paragraph explains why something happens and what happens as a result, including at least one chain where an effect becomes the next cause",
    think: "The author says the ice melts BECAUSE the sun warms it. 'Because' is my clue. The sun is the cause, and the melting is the effect.",
    organizer: { type: "pairs", boxes: ["Cause → Effect", "Cause → Effect", "Cause → Effect"] }
  },
  {
    id: "problem", name: "Problem & Solution", emoji: "🧩", genre: "fiction story",
    what: "The author shows a problem, the things people try, and how the problem finally gets solved.",
    kidQ: "What is the problem? What did they try? What finally worked?",
    signals: ["problem", "tried", "but", "decided", "solved", "finally"],
    aiDesc: "a problem-and-solution story where the characters try at least two solutions that do not work before one that does",
    think: "They tried a bigger net, but it didn't work. So that was a TRY, not the solution. The problem is still there, so I'll keep reading.",
    organizer: { type: "list", boxes: ["Problem", "Try 1 (did it work?)", "Try 2 (did it work?)", "Solution"] }
  },
  {
    id: "compare", name: "Compare & Contrast", emoji: "⚖️", genre: "nonfiction informational passage",
    what: "Comparing shows how two things are ALIKE. Contrasting shows how they are DIFFERENT.",
    kidQ: "How are these two things the same? How are they different?",
    signals: ["both", "alike", "same", "but", "however", "unlike", "different"],
    aiDesc: "a compare-and-contrast passage about exactly two things, with paragraphs that clearly show how they are alike and how they are different",
    think: "The author wrote 'unlike frogs.' That word tells me a DIFFERENCE is coming. Toads have dry, bumpy skin, and frogs don't.",
    organizer: { type: "venn", boxes: ["Only the first thing", "Both", "Only the second thing"] }
  },
  {
    id: "description", name: "Description", emoji: "🔎", genre: "nonfiction informational passage",
    what: "Description gives a main topic and then details that tell more about it.",
    kidQ: "What is the main topic? What details tell us more about it?",
    signals: ["for example", "such as", "also", "in addition", "has", "looks like"],
    aiDesc: "a descriptive passage with one clear main topic stated early, and each paragraph giving a different group of details about it",
    think: "The first paragraph says this is all about owls. Every paragraph after that tells me something more about owls. That's description.",
    organizer: { type: "list", boxes: ["Main topic", "Detail 1", "Detail 2", "Detail 3", "Main idea in 10 words or less"] }
  }
];

const TOPICS = [
  "a video game island adventure", "sports", "animals", "space", "weather",
  "dinosaurs", "friends", "the ocean", "building and inventing", "music"
];

const NAMES = ["Maya","Jordan","Leo","Amara","Eli","Zoe","Marcus","Nia","Theo","Ava","Jayden","Lila","Omar","Rosa","Kai","Imani","Ben","Sofia","Malik","Hana"];

const RUBRIC = [
  { id: "main", label: "Main idea", help: "Told what it was mostly about, in their own words" },
  { id: "order", label: "Key details in order", help: "Gave the important parts in the right order" },
  { id: "why", label: "The \"why\"", help: "Explained why something happened or why the author included a part" },
  { id: "words", label: "Used structure words", help: "Used words like because, first, problem, both, finally" }
];

/* ── Storage (on this device only) ───────────────────────────── */
let DB = { kids: [], sessions: [], rotationStart: null, current: null, placement: null };
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) DB = Object.assign(DB, JSON.parse(raw));
  } catch (e) { /* storage unavailable: run in memory */ }
  if (!DB.rotationStart) DB.rotationStart = mondayOf(new Date()).toISOString();
  if (DB.current) delete DB.current._prefetching;
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(DB)); } catch (e) {}
}

/* ── Helpers ─────────────────────────────────────────────────── */
const $ = (sel) => document.querySelector(sel);
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function uid() { return Math.random().toString(36).slice(2, 10); }
function mondayOf(d) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const day = (x.getDay() + 6) % 7;
  x.setDate(x.getDate() - day);
  return x;
}
function weekStructureIndex() {
  const start = mondayOf(new Date(DB.rotationStart));
  const weeks = Math.floor((mondayOf(new Date()) - start) / (7 * 864e5));
  return ((weeks % STRUCTURES.length) + STRUCTURES.length) % STRUCTURES.length;
}
function structById(id) { return STRUCTURES.find(s => s.id === id) || STRUCTURES[0]; }
function kidById(id) { return DB.kids.find(k => k.id === id); }
function fmtDate(iso) { const d = new Date(iso); return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }); }

/* ── Estimated reading level ─────────────────────────────────────
   Lexile is proprietary. This estimate uses the same two signals
   Lexile relies on (sentence length + word difficulty, here via
   syllables) through Flesch-Kincaid, mapped to an approximate
   Lexile scale. Treat it as a guide; spot-check at lexile.com. */
function syllables(word) {
  let w = word.toLowerCase().replace(/[^a-z]/g, "");
  if (!w) return 0;
  if (w.length <= 3) return 1;
  w = w.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/, "").replace(/^y/, "");
  const m = w.match(/[aeiouy]{1,2}/g);
  return Math.max(1, m ? m.length : 1);
}
function textStats(paragraphs) {
  const text = paragraphs.join(" ");
  const sentences = text.split(/[.!?]+(?:["'”’)]*)(?:\s+|$)/).map(s => s.trim()).filter(s => /[a-zA-Z]/.test(s));
  const words = text.match(/[A-Za-z][A-Za-z'’-]*/g) || [];
  const syl = words.reduce((n, w) => n + syllables(w), 0);
  const wc = words.length, sc = Math.max(1, sentences.length);
  const msl = wc / sc, spw = wc ? syl / wc : 0;
  const fk = 0.39 * msl + 11.8 * spw - 15.59;
  let lex = Math.round((120 + 140 * fk) / 10) * 10;
  lex = Math.max(100, Math.min(1100, lex));
  return { words: wc, sentences: sc, msl: +msl.toFixed(1), spw: +spw.toFixed(2), lexile: lex };
}
function levelRules(target) {
  const msl = Math.max(6, Math.min(15, Math.round(3 + target / 80)));
  let vocab;
  if (target < 450) vocab = "Use mostly one- and two-syllable everyday words. Avoid words with three or more syllables except names.";
  else if (target < 600) vocab = "Use mostly common words. Allow a few three-syllable words when the topic needs them.";
  else vocab = "Use rich but kid-friendly vocabulary. Include a few topic words (three syllables is fine) that the meaning around them helps explain.";
  return { msl, vocab };
}

/* ── Story generation ────────────────────────────────────────── */
function buildPrompt({ structure, topic, level, words, paragraphs, stops, adjust }) {
  const r = levelRules(level);
  const name = NAMES[Math.floor(Math.random() * NAMES.length)];
  const lines = [
    `Write a ${structure.genre} for 3rd grade students who read at about ${level}L on the Lexile scale.`,
    `Topic: ${topic}.`,
    structure.genre.startsWith("fiction") ? `The main character is named ${name}.` : `Keep every fact accurate and true.`,
    `TEXT STRUCTURE: ${structure.name}. Build the passage as ${structure.aiDesc}. Make the structure easy to notice. Use these signal words naturally: ${structure.signals.join(", ")}.`,
    `LENGTH: about ${words} words in ${paragraphs} paragraphs.`,
    `READING LEVEL: average sentence length about ${r.msl} words. ${r.vocab}`,
    adjust || "",
  ];
  if (stops > 0) {
    lines.push(`Write ${stops} "stop and ask" questions a parent asks while reading this aloud. Each one goes after a paragraph (never after the last paragraph, and spread them out). Each must ask about how the text works: why the author included a part, what changed, what caused something, or how two parts connect. Never ask simple recall questions such as colors, names, or numbers. For each, give a short "lookFor" answer telling the parent what a good answer includes.`);
  }
  lines.push(`Write 3 after-reading questions about the ${structure.name.toLowerCase()} structure, each with a short answer for the parent.`);
  lines.push(`Return ONLY valid JSON with no markdown and no extra text, in exactly this shape:`);
  lines.push(`{"title":"...","paragraphs":["...","..."],"stops":[{"after":0,"question":"...","lookFor":"..."}],"questions":[{"q":"...","a":"..."}]}`);
  lines.push(`"after" is the 0-based index of the paragraph the stop comes after.${stops > 0 ? "" : ` Use an empty array for "stops".`}`);
  return lines.filter(Boolean).join("\n");
}

function parseStory(raw) {
  let t = String(raw || "").trim().replace(/^```(?:json)?/i, "").replace(/```$/, "").trim();
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  if (a < 0 || b < a) throw new Error("The story came back in the wrong format.");
  const obj = JSON.parse(t.slice(a, b + 1));
  const paragraphs = (obj.paragraphs || []).map(p => String(p).trim()).filter(Boolean);
  if (paragraphs.length < 2) throw new Error("The story came back too short.");
  const stops = (obj.stops || [])
    .map(s => ({ after: Math.max(0, Math.min(paragraphs.length - 2, parseInt(s.after, 10) || 0)), question: String(s.question || ""), lookFor: String(s.lookFor || "") }))
    .filter(s => s.question);
  const questions = (obj.questions || []).map(q => ({ type: String(q.type || "").toLowerCase(), q: String(q.q || ""), a: String(q.a || "") })).filter(q => q.q);
  return { title: String(obj.title || "Today's Story"), paragraphs, stops, questions };
}

async function callStory(prompt) {
  let res;
  try {
    res = await fetch(CF_STORY, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ grade: "3rd", topic: "comprehension", wordCount: 300, instructions: prompt })
    });
  } catch (e) {
    throw Object.assign(new Error("Couldn't reach the story service."), { kind: "network" });
  }
  if (!res.ok) {
    let detail = "";
    try { detail = (await res.json()).error || ""; } catch (e) {}
    throw Object.assign(new Error(`Story service error ${res.status}${detail ? ": " + detail : ""}`), { kind: "server", status: res.status });
  }
  const data = await res.json();
  if (!data.story) throw new Error("The story service returned nothing.");
  return data.story;
}

/* Generate, estimate the level, and regenerate once if far off. */
async function generateLeveled(opts, buildFn = buildPrompt, minQuestions = 0) {
  let best = null;
  let adjust = "";
  for (let attempt = 0; attempt < 2; attempt++) {
    const raw = await callStory(buildFn(Object.assign({}, opts, { adjust })));
    let story;
    try {
      story = parseStory(raw);
      if (story.questions.length < minQuestions) throw new Error("The questions didn't come back. Try again.");
    }
    catch (e) { if (attempt === 0) continue; throw e; }
    story.stats = textStats(story.paragraphs);
    const off = story.stats.lexile - opts.level;
    if (!best || Math.abs(off) < Math.abs(best.stats.lexile - opts.level)) best = story;
    if (Math.abs(off) <= 120) break;
    adjust = off > 0
      ? `IMPORTANT: Your last version was too hard (about ${story.stats.lexile}L). Use shorter sentences (about ${Math.max(5, levelRules(opts.level).msl - 2)} words) and simpler, shorter words.`
      : `IMPORTANT: Your last version was too easy (about ${story.stats.lexile}L). Use somewhat longer sentences (about ${levelRules(opts.level).msl + 2} words) and a few richer words.`;
  }
  if (!best) throw new Error("Couldn't get a usable story. Try again.");
  best.target = opts.level;
  return best;
}

/* ── Placement check ───────────────────────────────────────────
   An informal reading inventory: the child reads short passages
   aloud (timed, misses counted), then answers 5 questions without
   looking back. 4–5 right = passes the level. Levels move up or
   down 100L until we find the highest level they pass (max 4
   passages). An optional listening check sets the read-aloud level. */

const PLACE_TOPICS = ["a kid who finds a lost puppy", "how bees make honey", "a soccer team's comeback", "why the moon changes shape",
  "a girl who builds a treehouse", "how snow forms", "a class science fair", "how sea turtles find the ocean"];
const QTYPES = [
  { id: "literal", label: "Remembering details", help: "Answer is stated right in the text" },
  { id: "vocab", label: "Word meaning", help: "Figuring out a word from the words around it" },
  { id: "inference", label: "Reading between the lines", help: "Putting clues together" },
  { id: "structure", label: "How the text is built", help: "Why the author included a part, how parts connect" }
];
const PLACE_MAX_ROUNDS = 4;

function buildPlacementPrompt({ level, topic, words, paragraphs, fiction, adjust }) {
  const r = levelRules(level);
  const name = NAMES[Math.floor(Math.random() * NAMES.length)];
  return [
    `Write a ${fiction ? "fiction story" : "nonfiction informational passage"} for a reading check, for a child who reads at about ${level}L on the Lexile scale.`,
    `Topic: ${topic}.`,
    fiction ? `The main character is named ${name}.` : `Keep every fact accurate and true.`,
    `LENGTH: about ${words} words in ${paragraphs} paragraphs. It must make sense on its own and hold enough information for the questions.`,
    `READING LEVEL: average sentence length about ${r.msl} words. ${r.vocab}`,
    adjust || "",
    `Write exactly 5 comprehension questions in this order:`,
    `1-2. type "literal": the answer is stated directly in the text.`,
    `3. type "vocab": ask what one specific word from the text means, where the sentences around it give clues. Put the word in quotes.`,
    `4. type "inference": the answer is NOT stated directly; the child must put clues together.`,
    `5. type "structure": how the text is organized or why the author included a specific part.`,
    `Each answer must be short and specific so a parent can mark it right or wrong.`,
    `Return ONLY valid JSON with no markdown and no extra text, in exactly this shape:`,
    `{"title":"...","paragraphs":["...","..."],"questions":[{"type":"literal","q":"...","a":"..."}]}`
  ].filter(Boolean).join("\n");
}

function P() { return DB.placement; }
function roundCorrect(r) { return (r.marks || []).filter(m => m === true).length; }
function roundMarked(r) { return (r.marks || []).filter(m => m !== null && m !== undefined).length; }
function roundPassed(r) { return roundCorrect(r) >= 4; }
function roundAccuracy(r) {
  if (!r.story) return null;
  const w = r.story.stats.words;
  return w ? Math.max(0, Math.round(((w - (r.misses || 0)) / w) * 100)) : null;
}
function roundWpm(r) {
  if (!r.story || !r.ms || r.ms < 5000) return null;
  return Math.round(r.story.stats.words / (r.ms / 60000));
}

function startPlacement(kidId) {
  const k = kidById(kidId);
  const start = Math.max(200, Math.min(900, Math.round((k.practice || 400) / 100) * 100));
  DB.placement = { kidId, date: new Date().toISOString(), start, rounds: [], listen: null, stage: "intro", lookBack: false };
  save();
  view = "place";
  render();
  window.scrollTo(0, 0);
}

/* Decide whether to stop, or which level comes next. */
function placementNext() {
  const p = P();
  const done = p.rounds.filter(r => r.phase === "done");
  if (!done.length) return { stop: false, level: p.start };
  const last = done[done.length - 1];
  const tried = done.map(r => r.target);
  const passes = done.filter(roundPassed);
  const hiPass = passes.length ? Math.max(...passes.map(r => r.target)) : null;
  const bracketed = hiPass !== null && done.some(r => !roundPassed(r) && r.target > hiPass);
  if (bracketed || done.length >= PLACE_MAX_ROUNDS) return { stop: true };
  const next = roundPassed(last) ? last.target + 100 : last.target - 100;
  if (next < 200 || next > 900 || tried.includes(next)) return { stop: true };
  return { stop: false, level: next };
}

function placementResult() {
  const p = P();
  const done = p.rounds.filter(r => r.phase === "done");
  const passes = done.filter(roundPassed);
  let practice, note = "", basis = null;
  if (passes.length) {
    basis = passes.reduce((a, b) => (b.target > a.target ? b : a));
    practice = Math.round(Math.min(basis.target, basis.story.stats.lexile + 50) / 10) * 10;
    const nextUp = done.find(r => r.target === basis.target + 100);
    if (nextUp && roundCorrect(nextUp) === 3) { practice += 50; note = "Almost passed the next level up, so we started a little higher."; }
    if (!done.some(r => !roundPassed(r) && r.target > basis.target)) note = "Passed every level tried. Run the check again soon to find the ceiling.";
  } else {
    const lowest = Math.min(...done.map(r => r.target));
    practice = Math.max(150, lowest - 100);
    note = "Didn't pass any level tried, so this starting point is below the lowest one. Retest in 3–4 weeks.";
  }
  // Fluency on the placement level (or nearest passage read).
  const ref = basis || done[0];
  const wpm = ref ? roundWpm(ref) : null;
  const accuracy = ref ? roundAccuracy(ref) : null;
  // Where comprehension breaks down, across every passage.
  const byType = {};
  QTYPES.forEach(t => (byType[t.id] = { right: 0, total: 0 }));
  done.forEach(r => r.story.questions.forEach((q, i) => {
    const t = byType[q.type] ? q.type : null;
    if (!t || r.marks[i] === null || r.marks[i] === undefined) return;
    byType[t].total++;
    if (r.marks[i]) byType[t].right++;
  }));
  // Listening level.
  let listen = practice + 200, listenNote = "Listening wasn't checked, so this is set 200L above.";
  if (p.listen && p.listen.phase === "done") {
    const c = roundCorrect(p.listen);
    listen = practice + (c >= 4 ? 200 : c === 3 ? 150 : 100);
    listenNote = `${c}/5 on the read-aloud check at ${p.listen.story.stats.lexile}L.`;
  }
  // What's limiting them.
  const failedHigher = done.filter(r => !roundPassed(r) && (!basis || r.target > basis.target));
  const decodingLimited = failedHigher.some(r => (roundAccuracy(r) || 100) < 93) || (accuracy !== null && accuracy < 93);
  const limit = !done.length ? "" : decodingLimited
    ? "Word reading is part of the limit: accuracy dropped below 93% on harder text. Keep up phonics and fluency practice alongside comprehension."
    : "Comprehension is the limit, not word reading: accuracy stayed high even on the levels they didn't pass. Focus on the Comprehension sessions.";
  return { practice, listen, note, listenNote, wpm, accuracy, byType, limit };
}

/* Placement passage at a level: unseen library form first, AI only as backup. */
async function placementPassage(level, fiction, topicIdx) {
  const p = P();
  try {
    await loadLibrary();
    const inCheck = p.rounds.map(r => r.story && r.story.id).concat(p.listen && p.listen.story ? [p.listen.story.id] : []).filter(Boolean);
    const pool = LIB.placement.filter(r => r.level === level && !inCheck.includes(r.id));
    if (pool.length) {
      const used = usedBy([p.kidId], "placeUsed");
      const fresh = pool.filter(r => !used.has(r.id));
      const list = fresh.length ? fresh : pool;
      const raw = list[Math.floor(Math.random() * list.length)];
      const st = libStory(raw, level);
      st.questions = st.questions.slice(0, 5);
      return st;
    }
  } catch (e) { /* fall back to AI */ }
  const st = await generateLeveled({
    level, topic: PLACE_TOPICS[topicIdx % PLACE_TOPICS.length],
    words: level < 450 ? 140 : 170, paragraphs: 3, fiction
  }, buildPlacementPrompt, 5);
  st.questions = st.questions.slice(0, 5);
  return st;
}

async function loadPlacementRound() {
  const p = P();
  const n = placementNext();
  if (n.stop) { p.stage = "listen-offer"; save(); render(); return; }
  busy = true; lastError = null; p.stage = "round"; render();
  try {
    const idx = p.rounds.length;
    const story = await placementPassage(n.level, idx % 2 === 0, idx + Math.floor(Math.random() * 8));
    p.rounds.push({ target: n.level, story, phase: "read", ms: 0, misses: 0, marks: story.questions.map(() => null) });
    save();
  } catch (e) { lastError = e; }
  finally { busy = false; render(); window.scrollTo(0, 0); }
}

async function loadListenCheck() {
  const p = P();
  const res = placementResult();
  const level = Math.max(200, Math.min(900, Math.round((res.practice + 200) / 100) * 100));
  busy = true; lastError = null; p.stage = "listen"; render();
  try {
    const story = await placementPassage(level, true, Math.floor(Math.random() * 8));
    p.listen = { target: level, story, phase: "read", marks: story.questions.map(() => null) };
    save();
  } catch (e) { lastError = e; }
  finally { busy = false; render(); window.scrollTo(0, 0); }
}

function savePlacement() {
  const p = P();
  const k = kidById(p.kidId);
  const r = placementResult();
  k.practice = r.practice;
  k.listen = r.listen;
  k.placements = (k.placements || []).concat({ date: p.date, practice: r.practice, listen: r.listen, wpm: r.wpm, accuracy: r.accuracy, byType: r.byType });
  markUsed("placeUsed", [p.kidId], p.rounds.map(r => r.story && r.story.id).concat(p.listen && p.listen.story ? [p.listen.story.id] : []));
  DB.placement = null;
  save();
}

      </div>

      <div class="card"><h3>Question types (all passages)</h3>

function fmtMs(ms) { const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }

function levelBadge(story) {
  const off = Math.abs(story.stats.lexile - story.target);
  return `<span class="badge ${off > 120 ? "warn" : ""}" title="Estimated from sentence length and word difficulty">≈ ${story.stats.lexile}L · goal ${story.target}L</span>`;
}

function loadingCard(msg) {
  return `<div class="card loading"><div class="spin"></div><p>${esc(msg)}</p><p class="muted">Usually 10–20 seconds.</p></div>`;
}

function errorCard(err) {
  const backend = err.kind === "server" || err.kind === "network";
  return `<div class="card"><div class="error">
    <b>${esc(err.message)}</b>
    ${backend ? `<p style="margin-top:8px">The AI story service isn't responding (the Firebase function, the Blaze plan, or the Anthropic balance). The story library works without it.</p>` : ""}
    </div>
    <div class="row" style="margin-top:12px"><button class="btn" data-act="retry">Try again</button>
    ${view === "session" ? `<button class="btn secondary" data-act="use-library">📚 Use a library story</button>` : ""}</div></div>`;
}

function questionsCard(qs, title) {
  if (!qs || !qs.length) return "";
  return `<div class="card"><h3>${esc(title)}</h3><p class="muted">Tap a question to see a good answer.</p>
    ${qs.map(q => `<div class="q" data-toggle><b>${esc(q.q)}</b><div class="a">✔ ${esc(q.a)}</div></div>`).join("")}</div>`;
}

function timerCard(kids, R) {
  const s = S();

function chartSVG(scores) {
  const w = 300, h = 110, n = scores.length, bw = Math.min(26, (w - 20) / n - 6);
  const bars = scores.map((v, i) => {
    const x = 10 + i * ((w - 20) / n) + ((w - 20) / n - bw) / 2;
    const bh = Math.max(3, (v / 4) * (h - 30));
    return `<rect x="${x}" y="${h - 18 - bh}" width="${bw}" height="${bh}" rx="5" fill="var(--brand)"></rect>
      <text x="${x + bw / 2}" y="${h - 4}" font-size="11" text-anchor="middle" fill="var(--muted)">${v}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:420px" role="img" aria-label="Retell scores for recent sessions">
    <line x1="8" x2="${w - 8}" y1="${h - 18}" y2="${h - 18}" stroke="var(--border)"/>${bars}</svg>`;
}

/* ── Session flow ────────────────────────────────────────────── */
function startSession() {
  const custom = ($("#customTopic") && $("#customTopic").value.trim()) || "";
  const topic = custom || sel.topic;
  DB.current = {
    id: uid(), date: new Date().toISOString(), kidIds: sel.kidIds.slice(),
    structureId: sel.structureId, topic, step: 0, source: sel.source || "library",
    listen: null, read: null, organizer: {}, retell: {}, wpm: {}, swap: false, bigText: false, done: false
  };
  save();
  view = "session";
  render();
  window.scrollTo(0, 0);
}

function listenLevel(s) {
  const kids = s.kidIds.map(kidById).filter(Boolean);
  return Math.min(...kids.map(k => k.listen));
}
function readLevel(s) {
  const kids = s.kidIds.map(kidById).filter(Boolean);
  return Math.min(...kids.map(k => k.practice));
}

async function ensureStory(which, force, useAI) {
  const s = S();
  if (!force && s[which]) return;
  busy = true; lastError = null; render();
  try {
    const st = structById(s.structureId);
    const level = which === "listen" ? listenLevel(s) : readLevel(s);
    let story = null;
    if (!(useAI || s.source === "ai")) {
      try {
        await loadLibrary();
        const exclude = [s.listen && s.listen.id, s.read && s.read.id].concat(s.seen || []).filter(Boolean);
        const raw = pickFromPool(LIB.sessions.filter(r => r.structure === s.structureId), level, usedBy(s.kidIds, "used"), exclude);
        if (raw) story = libStory(raw, level);
      } catch (e) { /* library unavailable: fall through to AI */ }
    }
    if (!story) {
      const opts = which === "listen"
        ? { structure: st, topic: s.topic, level, words: 380, paragraphs: 6, stops: 4 }
        : { structure: st, topic: s.topic, level, words: 200, paragraphs: s.kidIds.length > 1 ? 6 : 4, stops: 0 };
      story = await generateLeveled(opts);
      story.source = "ai";
    }
    s[which] = story;
    if (story.id) s.seen = (s.seen || []).concat(story.id);
    save();
  } catch (e) {
    e.fromAI = true;
    lastError = e;
  } finally {
    busy = false;
    render();
  }
}

function goStep(n) {
  const s = S();
  s.step = Math.max(0, Math.min(4, n));
  lastError = null;
  stopTimer(false);
  save();
  render();
  window.scrollTo(0, 0);
  if (s.step === 1 && !s.listen) ensureStory("listen");
  if (s.step === 2 && !s.read) ensureStory("read");
  // Pre-write the practice story in the background while they listen.
  if (s.step === 1 && s.listen && !s.read) prefetchRead();
}

async function prefetchRead() {
  const s = S();
  if (s.source !== "ai" || s.read || s._prefetching) return;
  s._prefetching = true;
  try {
    const st = structById(s.structureId);
    s.read = await generateLeveled({ structure: st, topic: s.topic, level: readLevel(s), words: 200, paragraphs: s.kidIds.length > 1 ? 6 : 4, stops: 0 });
    save();
  } catch (e) { /* will retry when they reach Read */ }
  finally { s._prefetching = false; }
}

function finishSession() {
  const s = S();
  const scores = {};
  s.kidIds.forEach(id => {
    const r = (s.retell || {})[id] || {};
    scores[id] = RUBRIC.filter(x => r[x.id]).length;
  });
  DB.sessions.push({
    id: s.id, date: s.date, structureId: s.structureId, topic: s.topic, kidIds: s.kidIds,
    scores, wpm: s.wpm || {}, notes: Object.fromEntries(s.kidIds.map(id => [id, ((s.retell || {})[id] || {}).note || ""])),
    listenTitle: s.listen && s.listen.title, readTitle: s.read && s.read.title,
    listenLevel: s.listen && s.listen.stats.lexile, readLevel: s.read && s.read.stats.lexile
  });
  markUsed("used", s.kidIds, [s.listen && s.listen.id, s.read && s.read.id]);
  DB.current = null;
  save();
  view = "progress";
  render();
  window.scrollTo(0, 0);
}

/* ── Timer ───────────────────────────────────────────────────── */
function tick() {
  const d = $("#timerDisplay");
  if (!d) return;
  const secs = Math.floor((Date.now() - timer.start + timer.elapsed) / 1000);
  d.textContent = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, "0")}`;
}
function stopTimer(record) {
  if (!timer.running) return;
  clearInterval(timer.handle);
  timer.elapsed += Date.now() - timer.start;
  timer.running = false;
  const s = S();
  if (record && s && s.read && timer.kidId && timer.elapsed > 5000) {
    s.wpm = s.wpm || {};
    s.wpm[timer.kidId] = Math.round(s.read.stats.words / (timer.elapsed / 60000));
    save();
  }
}

/* ── Print ───────────────────────────────────────────────────── */
function printPack() {
  const s = S();
  const st = structById(s.structureId);
  const kids = s.kidIds.map(kidById).filter(Boolean);
  const storyBlock = (x, label) => x ? `<h1>${esc(x.title)}</h1><p><i>${esc(label)}</i></p>
    <div class="story">${x.paragraphs.map(p => `<p>${esc(p)}</p>`).join("")}</div>` : "";
  $("#printArea").innerHTML = `
    ${storyBlock(s.read, `Practice story · ${kids.map(k => k.name).join(" & ")}`)}
    <div class="pagebreak"></div>
    <h1>${st.emoji} ${esc(st.name)} organizer</h1>
    <p>Name: ____________________ &nbsp; Story: ${esc(s.listen ? s.listen.title : "")}</p>
    <p><b>${esc(st.kidQ)}</b></p>
    <p>Clue words: ${st.signals.map(esc).join(", ")}</p>
    ${organizerHTML(st, {}, false)}
    ${s.listen ? `<div class="pagebreak"></div>${storyBlock(s.listen, "Read-aloud story (for the adult)")}
      <h3>Stop &amp; ask</h3><ol>${s.listen.stops.map(x => `<li>${esc(x.question)} <i>(look for: ${esc(x.lookFor)})</i></li>`).join("")}</ol>` : ""}`;
  window.print();
}

/* ── Events ──────────────────────────────────────────────────── */
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act],[data-kid],[data-struct],[data-topic],[data-delkid],[data-toggle],[data-timerkid],[data-place],[data-mark],[data-lmark],[data-source]");
  if (!t) return;

  // Placement check
  if (t.dataset.place) { startPlacement(t.dataset.place); return; }
  if (t.dataset.mark || t.dataset.lmark) {
    const p = P();
    const target = t.dataset.mark ? p.rounds[p.rounds.length - 1] : p.listen;
    const [i, v] = (t.dataset.mark || t.dataset.lmark).split(":");
    target.marks[+i] = v === "1";
    save(); render();
    return;
  }
  if (view === "place" && t.dataset.act) {
    const p = P();
    const r = p && p.rounds[p.rounds.length - 1];
    switch (t.dataset.act) {
      case "place-begin": loadPlacementRound(); return;
      case "retry": if (p.stage === "listen") loadListenCheck(); else loadPlacementRound(); return;
      case "ptimer":
        if (ptimer.running) {
          clearInterval(ptimer.handle); ptimer.running = false;
          r.ms = Date.now() - ptimer.start; save();
        } else {
          ptimer = { running: true, start: Date.now(), handle: setInterval(ptick, 250) };
          r.ms = 0;
        }
        render(); return;
      case "miss": r.misses++; save(); render(); return;
      case "unmiss": r.misses = Math.max(0, r.misses - 1); save(); render(); return;
      case "place-toq": r.phase = "questions"; save(); render(); window.scrollTo(0, 0); return;
      case "place-back-read": r.phase = "read"; save(); render(); window.scrollTo(0, 0); return;
      case "place-score": r.phase = "done"; save(); loadPlacementRound(); return;
      case "place-listen": loadListenCheck(); return;
      case "place-listen-q": p.listen.phase = "questions"; save(); render(); window.scrollTo(0, 0); return;
      case "place-listen-done": p.listen.phase = "done"; p.stage = "result"; save(); render(); window.scrollTo(0, 0); return;
      case "place-skip-listen": p.listen = null; p.stage = "result"; lastError = null; save(); render(); window.scrollTo(0, 0); return;
      case "place-save": savePlacement(); view = "home"; render(); window.scrollTo(0, 0); return;
      case "place-exit":
        if (ptimer.running) { clearInterval(ptimer.handle); ptimer.running = false; }
        view = "home"; lastError = null; render(); window.scrollTo(0, 0); return;
      case "place-exit-discard":
        if (confirm("Discard this placement check?")) { DB.placement = null; save(); view = "home"; render(); }
        return;
    }
  }
  if (t.dataset.act === "place-resume") {
    view = "place"; lastError = null; render();
    const p = P();
    if (p.stage === "round" && (!p.rounds.length || p.rounds[p.rounds.length - 1].phase === "done")) loadPlacementRound();
    if (p.stage === "listen" && !p.listen) loadListenCheck();
    return;
  }
  if (t.dataset.act === "place-exit-discard") {
    if (confirm("Discard this placement check?")) { DB.placement = null; save(); render(); }
    return;
  }

  if (t.dataset.toggle !== undefined) { t.classList.toggle("open"); return; }

  if (t.dataset.kid && view === "home") {
    const id = t.dataset.kid;
    if (sel.kidIds.includes(id)) sel.kidIds = sel.kidIds.filter(x => x !== id);
    else sel.kidIds = sel.kidIds.concat(id).slice(-2);
    return render();
  }
  if (t.dataset.struct) { sel.structureId = t.dataset.struct; return render(); }
  if (t.dataset.source) { sel.source = t.dataset.source; return render(); }
  if (t.dataset.topic) { sel.topic = t.dataset.topic; const c = $("#customTopic"); if (c) c.value = ""; return render(); }
  if (t.dataset.delkid) {
    if (confirm("Remove this reader? Their saved scores will be hidden.")) {
      DB.kids = DB.kids.filter(k => k.id !== t.dataset.delkid); save(); render();
    }
    return;
  }
  if (t.dataset.timerkid) {
    stopTimer(false);
    timer = { running: false, start: 0, elapsed: 0, handle: null, kidId: t.dataset.timerkid };
    return render();
  }

  const act = t.dataset.act;
  const s = S();
  switch (act) {
    case "kids": view = "kids"; render(); window.scrollTo(0, 0); break;
    case "home": view = "home"; render(); window.scrollTo(0, 0); break;
    case "progress": view = "progress"; render(); window.scrollTo(0, 0); break;
    case "addkid": {
      const name = $("#newName").value.trim();
      const lex = parseInt($("#newLex").value, 10);
      if (!name) { $("#newName").focus(); return; }
      const practice = isNaN(lex) ? 400 : Math.max(150, Math.min(1000, Math.round(lex / 10) * 10));
      DB.kids.push({ id: uid(), name, practice, listen: Math.min(1100, practice + 200) });
      save(); render();
      break;
    }
    case "start": startSession(); break;
    case "resume": view = "session"; render(); if (s.step === 1 && !s.listen) ensureStory("listen"); if (s.step === 2 && !s.read) ensureStory("read"); break;
    case "discard": if (confirm("Discard this session?")) { DB.current = null; save(); render(); } break;
    case "back": goStep(s.step - 1); break;
    case "next":
      if (s.step === 4) finishSession();
      else goStep(s.step + 1);
      break;
    case "retry": ensureStory(s.step === 1 ? "listen" : "read", true); break;
    case "regen-listen": ensureStory("listen", true); break;
    case "regen-read": stopTimer(false); s.wpm = {}; ensureStory("read", true); break;
    case "ai-listen": ensureStory("listen", true, true); break;
    case "ai-read": stopTimer(false); s.wpm = {}; ensureStory("read", true, true); break;
    case "use-library": s.source = "library"; save(); ensureStory(s.step === 1 ? "listen" : "read", true, false); break;
    case "swap": s.swap = !s.swap; save(); render(); break;
    case "bigtext": s.bigText = !s.bigText; save(); render(); break;
    case "print": printPack(); break;
    case "timer":
      if (timer.running) { stopTimer(true); render(); }
      else {
        timer.elapsed = 0; timer.start = Date.now(); timer.running = true;
        timer.handle = setInterval(tick, 250);
        render();
      }
      break;
  }
});

document.addEventListener("input", (e) => {
  const s = S();
  // Reader edits
  const kc = e.target.closest("[data-kidedit]");
  if (kc && e.target.dataset.f) {
    const k = kidById(kc.dataset.kidedit);
    const f = e.target.dataset.f;
    if (f === "name") k.name = e.target.value.trim() || k.name;
    else { const v = parseInt(e.target.value, 10); if (!isNaN(v)) k[f] = Math.max(100, Math.min(1200, v)); }
    save();
    return;
  }
  if (!s) return;
  if (e.target.dataset.org !== undefined) { s.organizer[e.target.dataset.org] = e.target.value; save(); return; }
  const rc = e.target.closest("[data-retell]");
  if (rc) {
    const id = rc.dataset.retell;
    s.retell[id] = s.retell[id] || {};
    if (e.target.dataset.rub) {
      s.retell[id][e.target.dataset.rub] = e.target.checked;
      rc.querySelector(".score").textContent = RUBRIC.filter(x => s.retell[id][x.id]).length + "/4";
    }
    if (e.target.dataset.note !== undefined) s.retell[id].note = e.target.value;
    save();
  }
});

document.addEventListener("change", (e) => {
  if (e.target.id === "customTopic") { const v = e.target.value.trim(); if (v) { sel.topic = v; render(); } }
  // Normalize reader edits and re-render once a field is committed.
  if (e.target.closest("[data-kidedit]")) render();
});

load();
render();
</script>
