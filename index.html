<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chris II's Mouth Training</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100%;
    font-family: 'Comic Sans MS', 'Trebuchet MS', system-ui, sans-serif;
    background: linear-gradient(135deg, #a8edea 0%, #8ec5fc 50%, #84fab0 100%);
    color: #1a2a44;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    min-height: 100vh;
  }
  .app {
    width: 100%;
    max-width: 540px;
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(8px);
    border-radius: 24px;
    padding: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.25);
    margin-top: 12px;
  }
  h1 { font-size: 1.8rem; text-align: center; margin-bottom: 8px; text-shadow: 2px 2px 0 rgba(255,255,255,0.6); }
  h2 { font-size: 1.4rem; text-align: center; margin-bottom: 12px; }
  p { text-align: center; line-height: 1.4; }

  .btn {
    display: block; width: 100%;
    padding: 18px 20px; margin: 10px 0;
    font-size: 1.2rem; font-weight: bold;
    font-family: inherit;
    border: none; border-radius: 16px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 5px 0 rgba(0,0,0,0.2);
    color: #fff; text-align: center;
  }
  .btn:active:not(:disabled) {
    transform: translateY(3px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.2);
  }
  .btn-primary { background: linear-gradient(135deg, #ff6b35, #f7b733); }
  .btn-secondary { background: linear-gradient(135deg, #1e90ff, #00b4db); }
  .btn-success { background: linear-gradient(135deg, #11998e, #38ef7d); }
  .btn-info { background: linear-gradient(135deg, #4776e6, #8e54e9); }
  .btn-neutral { background: linear-gradient(135deg, #4b6cb7, #182848); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: 0 2px 0 rgba(0,0,0,0.2); }

  .btn-row { display: flex; gap: 10px; }
  .btn-row .btn { flex: 1; }

  .ex-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin: 12px 0;
  }
  .ex-card {
    background: rgba(255,255,255,0.7);
    border: 3px solid rgba(255,255,255,0.9);
    border-radius: 16px;
    padding: 14px 10px;
    text-align: center;
    cursor: pointer;
    color: #2d3a4a;
    font-family: inherit;
    font-weight: bold;
    font-size: 1rem;
    transition: transform 0.15s;
    position: relative;
  }
  .ex-card:active { transform: scale(0.96); }
  .ex-card .emoji { font-size: 2.2rem; display: block; margin-bottom: 6px; }
  .ex-card.completed { background: rgba(150, 255, 180, 0.85); border-color: #51cf66; }
  .ex-card .badge { position: absolute; top: 4px; right: 6px; font-size: 1.2rem; }

  .progress-wrap {
    width: 100%; max-width: 540px;
    background: rgba(255,255,255,0.6);
    border-radius: 12px; height: 14px;
    overflow: hidden; margin-top: 8px;
  }
  .progress-bar {
    height: 100%; background: linear-gradient(90deg, #ff6b35, #f7b733);
    transition: width 0.4s ease; width: 0%;
  }

  /* Local MP4 video player - plays inline */
  .local-video-wrap {
    width: 100%;
    border-radius: 16px;
    overflow: hidden;
    margin: 12px 0;
    background: #000;
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
  }
  .local-video {
    width: 100%;
    height: auto;
    display: block;
  }

  /* Tappable video thumbnail */
  .video-thumb {
    position: relative;
    width: 100%;
    border-radius: 16px;
    overflow: hidden;
    margin: 12px 0;
    background: #000;
    aspect-ratio: 16 / 9;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    transition: transform 0.15s;
  }
  .video-thumb:active { transform: scale(0.98); }
  .video-thumb img {
    width: 100%; height: 100%;
    object-fit: cover; display: block;
  }
  .play-overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.35);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px;
  }
  .play-circle {
    width: 80px; height: 80px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff6b35, #f7b733);
    color: #fff; font-size: 2.5rem;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 16px rgba(0,0,0,0.4);
    padding-left: 6px;
  }
  .play-label {
    color: #fff; font-weight: bold; font-size: 1.1rem;
    text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
  }

  /* Fullscreen in-app video modal */
  .video-modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    z-index: 9999;
    display: flex;
    flex-direction: column;
    padding: 12px;
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #fff;
    padding: 8px 4px 12px;
  }
  .modal-title {
    font-size: 1.1rem;
    font-weight: bold;
    flex: 1;
    text-align: center;
    padding: 0 12px;
  }
  .modal-close {
    width: 44px; height: 44px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.2);
    color: #fff;
    font-size: 1.6rem;
    cursor: pointer;
    flex-shrink: 0;
  }
  .modal-video {
    flex: 1;
    width: 100%;
    border: 0;
    border-radius: 12px;
    background: #000;
  }

  .timer-container { display: flex; justify-content: center; margin: 20px 0; }
  .timer-circle { position: relative; width: 180px; height: 180px; }
  .timer-circle svg { transform: rotate(-90deg); width: 100%; height: 100%; }
  .timer-circle .bg-ring { fill: none; stroke: rgba(255,255,255,0.6); stroke-width: 12; }
  .timer-circle .progress-ring {
    fill: none; stroke: #ff9500; stroke-width: 14;
    stroke-linecap: round;
    transition: stroke-dashoffset 1s linear;
  }
  .timer-text {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 3rem; font-weight: bold;
    text-shadow: 2px 2px 0 rgba(255,255,255,0.7);
  }

  .rounds { display: flex; justify-content: center; gap: 12px; margin: 12px 0; }
  .round-dot {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: rgba(255,255,255,0.7);
    border: 3px solid #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.9rem; font-weight: bold;
  }
  .round-dot.done { background: #00c4cc; }
  .round-dot.active { background: #ffd43b; color: #2d3a4a; }

  .exercise-info {
    background: rgba(255,255,255,0.6);
    border-radius: 12px;
    padding: 14px;
    margin: 10px 0;
  }
  .exercise-info p { font-size: 1.05rem; }

  @keyframes pop {
    0% { transform: scale(0.5); opacity: 0; }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); opacity: 1; }
  }
  .pop { animation: pop 0.5s ease; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
  }
  .bounce { animation: bounce 1s ease infinite; }

  .header-bar {
    display: flex; justify-content: space-between;
    align-items: center; width: 100%;
    max-width: 540px; padding: 4px 8px;
  }
  .home-btn {
    background: rgba(255,255,255,0.7);
    border: none; color: #2d3a4a;
    width: 44px; height: 44px;
    border-radius: 50%;
    font-size: 1.4rem; cursor: pointer;
  }
  .step-label { font-weight: bold; text-shadow: 1px 1px 0 rgba(255,255,255,0.7); }

  @media (max-width: 380px) {
    h1 { font-size: 1.5rem; }
    .timer-circle { width: 150px; height: 150px; }
    .timer-text { font-size: 2.4rem; }
    .btn { font-size: 1.05rem; padding: 16px; }
    .ex-card { font-size: 0.85rem; }
  }
</style>
</head>
<body>

<div class="header-bar">
  <button class="home-btn" id="homeBtn" title="Home">🏠</button>
  <div class="step-label" id="stepLabel"></div>
  <div style="width:44px;"></div>
</div>
<div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>

<div class="app" id="app"></div>

<script>
/* ============================================
   EXERCISE DATA
   - localVideo: optional path to a local MP4 file.
     If present, plays inline in the app.
     If missing, falls back to YouTube modal.
   - videoId: YouTube video ID (used as fallback)
   ============================================ */
const exercises = [
  {
    title: "Tongue Left / Right",
    emoji: "👅",
    description: "Use the tip of your tongue to touch each corner of your mouth slowly. Keep your jaw still.",
    duration: 60,
    rounds: 3,
    localVideo: "videos/tongue-left-right.mp4",
    videoId: "I1wyZki6KZo"
  },
  {
    title: "Cheek Puffs",
    emoji: "😊",
    description: "Move air from cheek to cheek, then top lip, then bottom lip.",
    duration: 60,
    rounds: 3,
    localVideo: "videos/Cheek-Puffs.mp4",
    videoId: "o9pzBN4KXAY"
  },
  {
    title: "Lip Trace",
    emoji: "👄",
    description: "Trace your lips slowly with your tongue. Do not move your jaw.",
    duration: 60,
    rounds: 3,
    localVideo: "videos/Lip-Trace.mp4",
    videoId: "4SNO61r4Nz8"
  },
  {
    title: "Tongue in Cheek",
    emoji: "😜",
    description: "Press your tongue into each cheek while keeping your mouth closed.",
    duration: 60,
    rounds: 3,
    localVideo: "videos/Tongue-in-Cheek.mp4",
    videoId: "QMtehcs0ZUM"
  },
  {
    title: "Button Pull",
    emoji: "🔘",
    description: "Hold the button with your lips and resist pulling.",
    duration: 60,
    rounds: 3,
    videoId: "65tlxqQ4A3A"
  },
  {
    title: "Spoon Hold",
    emoji: "🥄",
    description: "Hold a spoon with your lips and breathe through your nose.",
    duration: 60,
    rounds: 3,
    videoId: "J42EMhxFyos"
  },
  {
    title: "Spoon Press",
    emoji: "🥄",
    description: "Push your tongue against a spoon and hold.",
    duration: 60,
    rounds: 3,
    videoId: "4SNO61r4Nz8"
  },
  {
    title: "Balloon Blow",
    emoji: "🎈",
    description: "Blow a balloon slowly and control your breathing.",
    duration: 60,
    rounds: 3,
    videoId: "vEXx0XMCknk"
  }
];

const quickRoutineNames = ["Button Pull", "Spoon Hold", "Tongue Left / Right", "Tongue in Cheek"];

let state = {
  mode: 'home',
  routine: [],
  currentIdx: 0,
  currentRound: 0,
  videoWatched: false,
  timerInterval: null,
  timeLeft: 60,
  completed: []
};

const app = document.getElementById('app');
const progressBar = document.getElementById('progressBar');
const stepLabel = document.getElementById('stepLabel');
const homeBtn = document.getElementById('homeBtn');

homeBtn.addEventListener('click', () => {
  if (state.mode === 'home') return;
  if (confirm("Go back to home? Your current round will stop.")) {
    stopTimer();
    renderWelcome();
  }
});

function saveProgress() {
  localStorage.setItem('chrisii_completed', JSON.stringify(state.completed));
}
function loadProgress() {
  try {
    const saved = JSON.parse(localStorage.getItem('chrisii_completed') || '[]');
    state.completed = Array.isArray(saved) ? saved : [];
  } catch(e) { state.completed = []; }
}

/* ============================================
   IN-APP VIDEO MODAL
   - Opens a fullscreen overlay inside the app
   - Loads the YouTube watch page in an iframe
   - User taps X to close and return to wizard
   - Never actually leaves the app/page
   ============================================ */
function openVideoModal(videoId, title) {
  // Try the embed first; if blocked, the iframe will show YouTube's
  // own message and the user can tap "Open in YouTube" link
  const embedUrl = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&playsinline=1&rel=0&modestbranding=1`;
  const watchUrl = `https://www.youtube.com/watch?v=${videoId}`;

  const modal = document.createElement('div');
  modal.className = 'video-modal';
  modal.innerHTML = `
    <div class="modal-header">
      <button class="modal-close" id="closeModal">✕</button>
      <div class="modal-title">${title}</div>
      <div style="width:44px;"></div>
    </div>
    <iframe
      class="modal-video"
      src="${embedUrl}"
      title="${title}"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen
      playsinline></iframe>
    <p style="text-align:center; color:#fff; padding:10px; font-size:0.9rem;">
      Video not playing? <a href="${watchUrl}" target="_blank" rel="noopener" style="color:#ffd43b; font-weight:bold;">Open on YouTube ↗</a>
    </p>
  `;
  document.body.appendChild(modal);
  document.body.style.overflow = 'hidden';

  document.getElementById('closeModal').onclick = () => {
    document.body.removeChild(modal);
    document.body.style.overflow = '';
  };
}

function updateProgress() {
  if (state.mode === 'home' || state.routine.length === 0) {
    progressBar.style.width = '0%';
    stepLabel.textContent = '';
    return;
  }
  if (state.mode === 'single') {
    progressBar.style.width = '50%';
    stepLabel.textContent = state.routine[0].title;
    return;
  }
  const pct = (state.currentIdx / state.routine.length) * 100;
  progressBar.style.width = pct + '%';
  stepLabel.textContent = `Exercise ${state.currentIdx + 1} of ${state.routine.length}`;
}

/* ============================================
   HOME SCREEN with EXERCISE PICKER
   ============================================ */
function renderWelcome() {
  stopTimer();
  state.mode = 'home';
  state.routine = [];
  state.currentIdx = 0;
  progressBar.style.width = '0%';
  stepLabel.textContent = '';

  const cards = exercises.map((ex, i) => {
    const done = state.completed.includes(ex.title);
    return `
      <button class="ex-card ${done ? 'completed' : ''}" data-idx="${i}">
        ${done ? '<span class="badge">⭐</span>' : ''}
        <span class="emoji">${ex.emoji}</span>
        ${ex.title}
      </button>
    `;
  }).join('');

  app.innerHTML = `
    <h1 class="bounce">👋 Hi Chris II!</h1>
    <p style="font-size:1.1rem; margin: 10px 0;">Pick what you want to do!</p>

    <button class="btn btn-primary" id="startFull">🚀 Full Routine (8)</button>
    <button class="btn btn-secondary" id="startQuick">⚡ Quick Routine (4)</button>

    <h2 style="margin-top:18px;">🎯 Or pick one exercise</h2>
    <div class="ex-grid">${cards}</div>

    ${state.completed.length > 0 ? `
      <button class="btn btn-neutral" id="resetProgress">🗑️ Reset Stars (${state.completed.length})</button>
    ` : ''}
  `;

  document.getElementById('startFull').onclick = () => startRoutine('full');
  document.getElementById('startQuick').onclick = () => startRoutine('quick');

  document.querySelectorAll('.ex-card').forEach(card => {
    card.onclick = () => startSingleExercise(parseInt(card.dataset.idx));
  });

  const reset = document.getElementById('resetProgress');
  if (reset) reset.onclick = () => {
    if (confirm("Clear all your stars?")) {
      state.completed = [];
      saveProgress();
      renderWelcome();
    }
  };
}

function startRoutine(type) {
  state.mode = 'routine';
  if (type === 'quick') {
    state.routine = exercises.filter(e => quickRoutineNames.includes(e.title));
  } else {
    state.routine = [...exercises];
  }
  state.currentIdx = 0;
  state.currentRound = 0;
  state.videoWatched = false;
  renderExercise();
}

function startSingleExercise(idx) {
  state.mode = 'single';
  state.routine = [exercises[idx]];
  state.currentIdx = 0;
  state.currentRound = 0;
  state.videoWatched = false;
  renderExercise();
}

/* ============================================
   EXERCISE SCREEN with INLINE VIDEO
   ============================================ */
function renderExercise() {
  stopTimer();
  const ex = state.routine[state.currentIdx];
  if (!ex) { renderFinal(); return; }

  state.currentRound = 0;
  state.videoWatched = false;
  state.timeLeft = ex.duration;
  updateProgress();

  // Decide which video element to render:
  //  - localVideo present  => inline HTML5 <video> player (plays in-app)
  //  - otherwise           => YouTube thumbnail that opens modal
  let videoBlock;
  if (ex.localVideo) {
    videoBlock = `
      <div class="local-video-wrap">
        <video
          class="local-video"
          src="${ex.localVideo}"
          controls
          playsinline
          preload="metadata">
          Your browser doesn't support video playback.
        </video>
      </div>
    `;
  } else {
    const thumbUrl = `https://img.youtube.com/vi/${ex.videoId}/hqdefault.jpg`;
    videoBlock = `
      <div class="video-thumb" id="videoThumb">
        <img src="${thumbUrl}" alt="${ex.title} video" />
        <div class="play-overlay">
          <div class="play-circle">▶</div>
          <div class="play-label">Tap to Watch Video</div>
        </div>
      </div>
    `;
  }

  app.innerHTML = `
    <h2 class="pop">${ex.emoji} ${ex.title}</h2>
    <div class="exercise-info">
      <p>${ex.description}</p>
    </div>

    ${videoBlock}

    <button class="btn btn-info" id="markVideo">📺 Mark Video Watched</button>

    <div class="rounds" id="roundsDisplay">
      ${[1,2,3].map(n => `<div class="round-dot" data-round="${n}">${n}</div>`).join('')}
    </div>

    <button class="btn btn-success" id="startRound" disabled>▶️ Start Round 1</button>

    <div class="btn-row">
      <button class="btn btn-neutral" id="backBtn">⬅️ Back</button>
      <button class="btn btn-neutral" id="restartBtn">🔄 Restart</button>
    </div>
  `;

  // Wire up YouTube thumbnail click (only when no local video)
  const thumb = document.getElementById('videoThumb');
  if (thumb) thumb.onclick = () => openVideoModal(ex.videoId, ex.title);

  document.getElementById('markVideo').onclick = () => {
    state.videoWatched = true;
    const v = document.getElementById('markVideo');
    v.textContent = '✅ Video Watched!';
    v.disabled = true;
    document.getElementById('startRound').disabled = false;
  };

  document.getElementById('startRound').onclick = startRound;
  document.getElementById('backBtn').onclick = goBack;
  document.getElementById('restartBtn').onclick = () => {
    if (state.mode === 'single') {
      renderWelcome();
    } else if (confirm("Restart this routine from the start?")) {
      startRoutine(state.routine.length === 4 ? 'quick' : 'full');
    }
  };
}

function startRound() {
  const ex = state.routine[state.currentIdx];
  state.timeLeft = ex.duration;

  app.innerHTML = `
    <h2 class="pop">${ex.emoji} ${ex.title}</h2>
    <p style="font-size:1.3rem; margin: 10px 0;">Round ${state.currentRound + 1} of ${ex.rounds}</p>
    <p style="font-size:1.05rem; opacity:0.95;">${ex.description}</p>

    <div class="timer-container">
      <div class="timer-circle">
        <svg viewBox="0 0 200 200">
          <circle class="bg-ring" cx="100" cy="100" r="88"></circle>
          <circle class="progress-ring" id="progressRing" cx="100" cy="100" r="88"
            stroke-dasharray="552.92" stroke-dashoffset="0"></circle>
        </svg>
        <div class="timer-text" id="timerText">${ex.duration}</div>
      </div>
    </div>

    <div class="rounds">
      ${[0,1,2].map(i => {
        let cls = 'round-dot';
        if (i < state.currentRound) cls += ' done';
        if (i === state.currentRound) cls += ' active';
        return `<div class="${cls}">${i < state.currentRound ? '✓' : i+1}</div>`;
      }).join('')}
    </div>

    <p style="text-align:center; font-size:1.2rem; margin-top:10px;">You're doing great! 💪</p>

    <button class="btn btn-neutral" id="cancelRound">⏹️ Stop Round</button>
  `;

  document.getElementById('cancelRound').onclick = () => {
    stopTimer();
    renderExercise();
  };

  const ring = document.getElementById('progressRing');
  const timerText = document.getElementById('timerText');
  const totalDash = 552.92;
  const total = ex.duration;

  state.timerInterval = setInterval(() => {
    state.timeLeft--;
    timerText.textContent = state.timeLeft;
    const offset = totalDash * (1 - state.timeLeft / total);
    ring.style.strokeDashoffset = offset;

    if (state.timeLeft <= 0) {
      stopTimer();
      onRoundComplete();
    }
  }, 1000);
}

function stopTimer() {
  if (state.timerInterval) {
    clearInterval(state.timerInterval);
    state.timerInterval = null;
  }
}

function onRoundComplete() {
  const ex = state.routine[state.currentIdx];
  state.currentRound++;

  if (state.currentRound >= ex.rounds) {
    if (!state.completed.includes(ex.title)) {
      state.completed.push(ex.title);
      saveProgress();
    }
    renderExerciseComplete();
  } else {
    renderRoundComplete();
  }
}

function renderRoundComplete() {
  app.innerHTML = `
    <h1 class="pop">🎉 Round Complete!</h1>
    <p style="font-size:1.5rem; margin: 20px 0;">Nice job!</p>
    <div style="font-size:5rem; text-align:center;" class="bounce">⭐</div>

    <div class="rounds" style="margin: 20px 0;">
      ${[0,1,2].map(i => {
        let cls = 'round-dot';
        if (i < state.currentRound) cls += ' done';
        return `<div class="${cls}">${i < state.currentRound ? '✓' : i+1}</div>`;
      }).join('')}
    </div>

    <p style="text-align:center; margin: 14px 0;">Get ready for round ${state.currentRound + 1}!</p>
    <button class="btn btn-success" id="nextRound">▶️ Start Round ${state.currentRound + 1}</button>
  `;
  document.getElementById('nextRound').onclick = startRound;
}

function renderExerciseComplete() {
  const ex = state.routine[state.currentIdx];
  const isLast = state.currentIdx >= state.routine.length - 1;

  app.innerHTML = `
    <h1 class="pop">🏆 Exercise Complete!</h1>
    <p style="font-size:1.4rem; margin: 14px 0;">${ex.title}</p>
    <div style="font-size:5rem; text-align:center;" class="bounce">🌟🌟🌟</div>
    <p style="text-align:center; font-size:1.2rem; margin: 16px 0;">Awesome work, Chris II!</p>

    ${isLast
      ? `<button class="btn btn-success" id="nextEx">🎊 See My Stars!</button>`
      : `<button class="btn btn-success" id="nextEx">➡️ Next Exercise</button>`
    }
    <button class="btn btn-neutral" id="backHome">🏠 Home</button>
  `;
  document.getElementById('nextEx').onclick = () => {
    state.currentIdx++;
    if (state.currentIdx >= state.routine.length) {
      renderFinal();
    } else {
      renderExercise();
    }
  };
  document.getElementById('backHome').onclick = renderWelcome;
}

function goBack() {
  if (state.mode === 'single' || state.currentIdx === 0) {
    if (confirm("Go back to home?")) renderWelcome();
    return;
  }
  state.currentIdx--;
  renderExercise();
}

function renderFinal() {
  progressBar.style.width = '100%';
  stepLabel.textContent = 'Done!';

  app.innerHTML = `
    <h1 class="pop">🎊 Great job Chris II!</h1>
    <p style="font-size:1.3rem; margin: 14px 0; text-align:center;">You completed your training!</p>
    <div style="font-size:5rem; text-align:center;" class="bounce">🏆</div>

    <div class="ex-grid">
      ${state.routine.map(ex => `
        <div class="ex-card completed">
          <span class="badge">⭐</span>
          <span class="emoji">${ex.emoji}</span>
          ${ex.title}
        </div>
      `).join('')}
    </div>

    <button class="btn btn-primary" id="goHome">🏠 Back to Home</button>
    <button class="btn btn-secondary" id="doAgain">🔄 Do It Again</button>
  `;

  document.getElementById('goHome').onclick = renderWelcome;
  document.getElementById('doAgain').onclick = () => {
    if (state.mode === 'single') {
      startSingleExercise(exercises.indexOf(state.routine[0]));
    } else {
      const wasQuick = state.routine.length === 4;
      startRoutine(wasQuick ? 'quick' : 'full');
    }
  };
}

loadProgress();
renderWelcome();
</script>
</body>
</html>
